<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Your Event - EventDecor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="booking" data-root="" >
<section><div class="wrap"><h2>Book Your Event</h2><div class="split"><form class="box" id="bf" novalidate><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Phone</label><input type="tel" pattern="[0-9]{10}" title="10-digit phone number" required>
<div class="row"><div><label>Event type</label><select id="event"><option>Wedding</option><option>Birthday</option><option>Engagement</option><option>Anniversary</option><option>Baby Shower</option><option>Corporate</option></select></div><div><label>Event date</label><input id="date" type="date" required></div><div><label>Guest count</label><input type="number" min="1" required></div><div><label>Venue type</label><select><option>Home</option><option>Hotel</option><option>Hall</option><option>Outdoor</option><option>Office</option></select></div></div>
<label>Venue address</label><input id="addr" required><label>Package</label><select id="pkg"></select><label>Additional services</label>
<label><input type="checkbox" class="svc" value="Photography" data-price="5000">Photography - ₹5,000</label><label><input type="checkbox" class="svc" value="Catering" data-price="8000">Catering - ₹8,000</label><label><input type="checkbox" class="svc" value="DJ/Music" data-price="3000">DJ/Music - ₹3,000</label><label><input type="checkbox" class="svc" value="Flower Decoration" data-price="2500">Flower Decoration - ₹2,500</label><label><input type="checkbox" class="svc" value="Lighting" data-price="2000">Lighting - ₹2,000</label><label><input type="checkbox" class="svc" value="Stage Decoration" data-price="4000">Stage Decoration - ₹4,000</label>
<label>Special requirements</label><textarea rows="3"></textarea><p><button class="btn" type="submit">Submit Booking Request</button></p></form><aside class="panel sum"><h3>Booking summary</h3><div id="sum"></div></aside></div></div></section>
<script src="js/main.js"></script></body></html>
